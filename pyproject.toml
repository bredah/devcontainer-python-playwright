[project]
name = "devcontainer-python-playwright"
version = "0.1.0"
description = "Python development environment with Chainguard and Poetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv (>=1.2.4,<2.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.quality]
optional = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src"]
skip_gitignore = true

[dependency-groups]
dev = [
    "playwright (==1.65.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-playwright (>=0.10.0,<0.11.0)"
]
notebooks = [
    "jupyterlab (>=4.6.6,<5.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "nbclient (>=0.11.0,<0.12.0)"
]
quality = [
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tracing=retain-on-failure --screenshot=only-on-failure"
