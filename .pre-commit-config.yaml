default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (Black-compatible imports)
        entry: poetry run isort
        language: system
        types: [python]
      - id: black
        name: Black
        entry: poetry run black
        language: system
        types: [python]
      - id: flake8
        name: Flake8 (errors and cyclomatic complexity)
        entry: poetry run flake8
        language: system
        types: [python]
      - id: conventional-commits
        name: Conventional Commit message
        entry: python3 .agents/skills/conventional-commits/scripts/check_message.py
        language: system
        stages: [commit-msg]
